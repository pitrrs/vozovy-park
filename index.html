<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Servis vozového parku</title>
<meta name="theme-color" content="#22323D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Servis vozů">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap&subset=latin-ext" rel="stylesheet">
<style>
:root{
  --bg:#EEF0EE; --surface:#FFFFFF; --surface2:#E3E7E6; --ink:#1B2329; --muted:#5B666E; --line:#CDD3D2;
  --diesel:#22323D; --amber:#E89B00; --amber-bg:#FFF2D2; --red:#C8203A; --red-bg:#FDE3E6; --green:#237A4F; --green-bg:#DDF1E5;
  --eu:#0039A6; --focus:#1666D6;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#12181C; --surface:#1B2328; --surface2:#253038; --ink:#E6EBEC; --muted:#9AA6AC; --line:#33414A;
  --diesel:#0D1317; --amber:#F2AD1C; --amber-bg:#3A2E10; --red:#FF5D73; --red-bg:#3D1820; --green:#4CC98A; --green-bg:#16352A; --focus:#6AA7FF; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#12181C; --surface:#1B2328; --surface2:#253038; --ink:#E6EBEC; --muted:#9AA6AC; --line:#33414A;
  --diesel:#0D1317; --amber:#F2AD1C; --amber-bg:#3A2E10; --red:#FF5D73; --red-bg:#3D1820; --green:#4CC98A; --green-bg:#16352A; --focus:#6AA7FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.cond{font-family:"Barlow Condensed","Arial Narrow",Barlow,sans-serif}

header.top{background:var(--diesel);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header.top .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
header.top h1{margin:0;font:700 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.2px;flex:1}
header.top .role{font-size:13px;opacity:.8}
.back{background:none;border:0;color:#fff;font-size:22px;padding:4px 8px 4px 0;cursor:pointer}

main{max-width:1100px;margin:0 auto;padding:16px 16px 96px}
h2{font:700 24px/1.1 "Barlow Condensed",sans-serif;margin:24px 0 10px}
h2:first-child{margin-top:4px}
h3{font:600 18px/1.2 Barlow,sans-serif;margin:0 0 6px}
.muted{color:var(--muted)}
.small{font-size:14px}

/* SPZ plate */
.plate{display:inline-flex;align-items:stretch;background:#fff;color:#111;border:2px solid #111;border-radius:5px;overflow:hidden;font:700 20px/1 "Barlow Condensed",sans-serif;letter-spacing:1.5px;white-space:nowrap;vertical-align:middle}
.plate .eu{background:var(--eu);color:#fff;font:600 10px/1 Barlow,sans-serif;letter-spacing:0;padding:3px 4px;display:flex;align-items:flex-end}
.plate .no{padding:4px 8px 3px}
.plate.big{font-size:30px}.plate.big .eu{font-size:12px;padding:4px 6px}.plate.big .no{padding:6px 12px 5px}

/* deadlines */
.due{display:grid;gap:8px}
.due-row{display:flex;gap:12px;align-items:center;background:var(--surface);border-left:6px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;text-align:left;border-top:0;border-right:0;border-bottom:0;width:100%}
.due-row.late{border-left-color:var(--red);background:var(--red-bg)}
.due-row.soon{border-left-color:var(--amber);background:var(--amber-bg)}
.due-row.ok{border-left-color:var(--green)}
.due-row .what{flex:1;min-width:0}
.due-row .when{font-weight:600;text-align:right;font-size:15px}
.late .when{color:var(--red)} .soon .when{color:var(--ink)}
.calm{background:var(--surface);border-radius:6px;padding:14px;color:var(--muted)}

/* vehicle grid */
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:180px;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.car{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:flex;flex-direction:column}
.carmain{background:none;border:0;padding:0;margin:0;text-align:left;cursor:pointer;display:flex;flex-direction:column;flex:1;width:100%}
.car .book{margin:0 12px 12px;justify-content:center}
.car .ph{aspect-ratio:16/9;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.car .ph img{width:100%;height:100%;object-fit:cover}
.car .body{padding:10px 12px 12px;display:grid;gap:6px}
.car .name{font-weight:600}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--surface2)}
.tag.late{background:var(--red);color:#fff}.tag.soon{background:var(--amber);color:#1b1b1b}.tag.def{background:var(--diesel);color:#fff}
.tag.ok{background:var(--green-bg);color:var(--green)}

/* buttons */
.btn{border:0;border-radius:6px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--surface2);color:var(--ink);display:inline-flex;align-items:center;gap:6px;min-height:44px}
.btn.primary{background:var(--amber);color:#1b1b1b}
.btn.dark{background:var(--diesel);color:#fff}
.btn.danger{background:none;color:var(--red);padding-left:0}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:17px;padding:14px 20px;z-index:4}

/* detail */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;background:var(--surface);border-radius:8px;overflow:hidden}
@media(min-width:760px){.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}}
.hero .ph{background:var(--surface2);min-height:180px;display:flex;align-items:center;justify-content:center}
.hero .ph img{width:100%;height:100%;object-fit:cover;max-height:360px}
.hero .info{padding:16px;display:grid;gap:10px;align-content:start}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;margin:24px 0 12px;border-bottom:2px solid var(--line)}
.tabs button{background:none;border:0;padding:10px 4px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;text-align:center;line-height:1.2;font-size:15px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber)}

.list{display:grid;gap:10px}
.item{background:var(--surface);border-radius:8px;padding:12px 14px;border:1px solid var(--line)}
.item.click{cursor:pointer;text-align:left;width:100%}
.item .head{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.item p{margin:6px 0 0;white-space:pre-wrap}
.item .thumb{width:84px;height:64px;object-fit:cover;border-radius:4px;margin-top:8px}
.st{font-size:13px;font-weight:700;padding:2px 8px;border-radius:4px}
.st.nova{background:var(--red);color:#fff}.st.resi{background:var(--amber);color:#1b1b1b}
.st.hotovo{background:var(--green-bg);color:var(--green)}.st.odlozeno{background:var(--surface2);color:var(--muted)}
.parts{width:100%;border-collapse:collapse;margin-top:8px;font-size:14px}
.parts td,.parts th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
.parts .n{text-align:right;white-space:nowrap}
.sum{font-weight:700;text-align:right;margin-top:6px}
.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 12px}
.tasklist{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:15px}
.tasklist li::before{content:"✓ ";color:var(--green);font-weight:700}
.order{background:var(--surface);border:2px solid var(--amber);border-radius:8px;padding:14px;margin-top:16px}
.order .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;justify-content:space-between}
.bar{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin:8px 0 4px}.bar i{display:block;height:100%;background:var(--green)}
.ck{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px;margin-top:10px}
.ckrow{display:flex;gap:4px;align-items:stretch}.ckrow label{flex:1}
.rmT{border:1px solid var(--red);background:var(--red-bg);color:var(--red);border-radius:6px;width:48px;font-size:22px;font-weight:700;cursor:pointer;flex:none}
.ck label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer;min-height:48px;font-weight:500}
.ck input{width:24px;height:24px;accent-color:var(--green);flex:none}
.ck label:has(input:checked){background:var(--green-bg);border-color:var(--green)}
.addtask{display:flex;gap:6px;margin-top:10px}.addtask input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:44px}
.hbtn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 10px;font-weight:600;cursor:pointer;font-size:14px}
.auth{max-width:420px;margin:24px auto;background:var(--surface);border-radius:10px;padding:20px;display:grid;gap:12px}
.auth h2{margin:0}
.linkbtn{background:none;border:0;color:var(--focus);font-weight:600;cursor:pointer;padding:4px 0;text-align:left}
.err{color:var(--red);font-weight:600;margin:0}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:4px}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;min-height:40px;white-space:nowrap}
.seg button span{color:var(--muted);font-weight:500;margin-left:2px}
.seg button[aria-selected="true"]{background:var(--diesel);color:#fff;border-color:var(--diesel)}
.seg button[aria-selected="true"] span{color:#fff;opacity:.75}
.rowp{display:grid;grid-template-columns:1fr 64px 36px;gap:6px;align-items:center}
.rowp input{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-height:44px;width:100%}
.pgroup{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.pgroup h3{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.prow{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.prow .pn{flex:1;min-width:160px}
.prow .btn{min-height:38px;padding:6px 12px}
.pst{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px}
.pst.objednat{background:var(--red);color:#fff}.pst.objednano{background:var(--amber);color:#1b1b1b}.pst.dorazilo{background:var(--green-bg);color:var(--green)}
.sev{font-size:12px;font-weight:700;padding:2px 8px;border-radius:4px;margin-left:4px;text-transform:uppercase;letter-spacing:.3px}
.sev.krit{background:var(--red);color:#fff}.sev.lehka{background:var(--surface2);color:var(--muted)}
.item.krit{border-left:5px solid var(--red)}
.sevpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sevpick label{display:flex;gap:8px;align-items:center;justify-content:center;border:2px solid var(--line);border-radius:8px;padding:12px;font-weight:700;cursor:pointer;color:var(--ink);min-height:52px}
.sevpick input{width:20px;height:20px}
.sevpick label.k:has(input:checked){border-color:var(--red);background:var(--red-bg);color:var(--red)}
.sevpick label.l:has(input:checked){border-color:var(--green);background:var(--green-bg);color:var(--green)}
.dhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 6px}
.mhead{font:700 18px/1.2 "Barlow Condensed",sans-serif;color:var(--muted);margin:18px 0 8px;text-transform:capitalize}
.lbl{font-size:13px;font-weight:600;color:var(--muted);margin-top:8px}
.types{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* sheet (dialog) */
dialog{border:0;border-radius:12px 12px 0 0;padding:0;width:100%;max-width:640px;max-height:92vh;margin:auto auto 0;background:var(--surface);color:var(--ink)}
@media(min-width:700px){dialog{border-radius:12px;margin:auto}}
dialog::backdrop{background:rgba(10,15,18,.55)}
dialog form{display:flex;flex-direction:column;max-height:92vh}
dialog .dh{padding:16px 18px 8px;display:flex;align-items:center;gap:8px}
dialog .dh h3{flex:1;margin:0;font:700 22px/1.1 "Barlow Condensed",sans-serif}
dialog .db{padding:4px 18px 16px;overflow:auto;display:grid;gap:12px}
dialog .df{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
#conf{max-width:420px;margin:auto;border-radius:12px}
.x{background:none;border:0;font-size:24px;cursor:pointer;color:var(--muted);padding:4px 8px}
label.f{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
label.f input,label.f select,label.f textarea,.row input{font-weight:400;color:var(--ink);padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);width:100%;min-height:44px}
textarea{resize:vertical;min-height:80px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:10px 12px 12px;margin:0;display:grid;gap:10px}
legend{font-weight:700;padding:0 4px}
.chk{display:flex;gap:8px;align-items:center;font-weight:500;color:var(--ink);padding:6px 0}
.chk input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{border:1px solid var(--line);border-radius:20px;padding:6px 12px;cursor:pointer;font-weight:500;display:flex;gap:6px;align-items:center}
.chips input{accent-color:var(--amber)}
.row{display:grid;grid-template-columns:1fr 64px 100px 36px;gap:6px;align-items:center}
.rowc{display:grid;grid-template-columns:1fr 150px 36px;gap:6px;align-items:center}
.rm{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--diesel);color:#fff;padding:10px 16px;border-radius:6px;z-index:50;max-width:90vw;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:20px;text-align:center;color:var(--muted)}
.more{background:none;border:0;color:var(--focus);font-weight:600;cursor:pointer;padding:8px 0}
@media (prefers-reduced-motion:no-preference){ .due-row,.carmain{transition:transform .12s} .carmain:active,.due-row:active{transform:scale(.99)} }
</style>
</head>
<body>
<header class="top"><div class="in" id="hdr"><h1>Servis vozového parku</h1></div></header>
<main id="app"><p class="muted">Načítám…</p></main>
<dialog id="sheet"></dialog>
<dialog id="conf"></dialog>

<script type="module">
import firebaseConfig from "./config.js";
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, query, where, orderBy, limit, onSnapshot, addDoc, setDoc, updateDoc, deleteDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = (d=new Date()) => { const z=d.getTimezoneOffset()*60000; return new Date(d - z).toISOString().slice(0,10); };
const parseD = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addMonths = (s,m) => { const d=parseD(s); return iso(new Date(d.getFullYear(), d.getMonth()+m, d.getDate())); };
const daysUntil = s => { const n=new Date(); n.setHours(0,0,0,0); return Math.round((parseD(s)-n)/86400000); };
const fD = s => { if(!s) return "—"; const d=parseD(s); return `${d.getDate()}. ${d.getMonth()+1}. ${d.getFullYear()}`; };
const fKm = n => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("cs-CZ")+" km";
const fKc = n => Math.round(n||0).toLocaleString("cs-CZ")+" Kč";
const num = v => { if(v===""||v==null) return null; const n=Number(String(v).replace(/\s/g,"").replace(",", ".")); return isNaN(n)?null:n; };
const plural = (n,a,b,c) => n===1?a:(n>=2&&n<=4?b:c);
const PIXEL="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
const photoCache={}, photoLoading={};
function blob(id){ if(!id) return ""; if(photoCache[id]) return photoCache[id]; loadPhoto(id); return PIXEL; }
async function loadPhoto(id){
  if(photoLoading[id]) return; photoLoading[id]=true;
  try{ const snap=await getDoc(doc(fs,"photos/"+id)); if(snap.exists()){ photoCache[id]=snap.data().data; $$('img[data-pid="'+id+'"]').forEach(i=>i.src=photoCache[id]); } }
  catch(e){ photoLoading[id]=false; }
}

const CATS = {truck:"Nákladní vozy", machine:"Stavební stroje", car:"Osobní auta"};
const catOf = v => (v&&CATS[v.category]) ? v.category : "truck";
const isMach = v => catOf(v)==="machine";
const U = v => isMach(v) ? "mth" : "km";
const fKmV = (n,v) => (n==null||isNaN(n)) ? "—" : Math.round(n).toLocaleString("cs-CZ")+" "+U(v);
const PSTAT = {objednat:"K objednání", objednano:"Objednáno", dorazilo:"Dorazilo"};
const SEV = {krit:"Kritická", lehka:"Lehká"};
const sevOf = d => d.severity==="krit" ? "krit" : "lehka";
const isOpenD = d => d.status==="nova"||d.status==="resi";
const STATUS = {nova:"Nová", resi:"V řešení", hotovo:"Opraveno", odlozeno:"Odloženo"};
const TASKS = ["Výměna motorového oleje","Výměna vzduchového filtru","Výměna palivového filtru","Výměna naftového filtru na motoru","Výměna olejového filtru","Výměna odstředivky","Olej v nápravě 1","Olej v nápravě 2","Olej v nápravě 3","Olej v nápravě 4","Olej v nápravě 5","Olej převodovka","Olej sestup"];
const TYPES = ["Oprava","Výměna oleje","Pravidelný servis","STK","Pneu","Jiné"];

let db=null, assets=null, user=null, myId=null, isService=false;
const S = { vehicles:[], defects:[], readings:{}, orders:{}, parts:[], pf:"objednat", df:"open", allLogs:[], dk:"all", logs:[], view:"home", vid:null, cat:(()=>{ try{ return localStorage.getItem("cat")||"all"; }catch(e){ return "all"; } })(), tab:"defects", q:"", showAllDone:false, ready:{v:false,d:false} };
let unsubLog=null;

function askConfirm(msg, ok="Smazat"){
  return new Promise(res=>{
    const c=document.getElementById("conf"); let done=false;
    c.innerHTML=`<div style="padding:18px;display:grid;gap:16px"><p style="margin:0;font-weight:600">${esc(msg)}</p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn ghost" data-a="0">Ne</button><button type="button" class="btn" data-a="1" style="background:var(--red);color:#fff">${esc(ok)}</button></div></div>`;
    const fin=v=>{ if(done) return; done=true; if(c.open) c.close(); res(v); };
    c.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>fin(b.dataset.a==="1"));
    c.oncancel=e=>{ e.preventDefault(); fin(false); }; c.onclose=()=>fin(false);
    c.showModal();
  });
}
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3200); }
function errMsg(e){
  const c=e&&e.code;
  if(c==="invalid_argument"||c==="permission-denied") return "Nemáte oprávnění tohle uložit.";
  if(c==="unavailable") return "Jste offline – změna se odešle, až bude signál.";
  if(c==="quota_exceeded") return "Úložiště je plné – smažte staré záznamy.";
  if(c==="too_large") return "Fotka je moc velká (max. 20 MB).";
  if(c==="unsupported_type"||c==="decode") return "Tento formát fotky nejde nahrát. Zkuste JPG nebo PNG – na iPhonu: Nastavení › Fotoaparát › Formáty › Nejkompatibilnější.";
  if(c==="rate_limited") return "Moc rychle za sebou – chvíli počkejte a zkuste znovu.";
  if(c==="unauthenticated") return "Přihlášení vypršelo – přihlaste se znovu.";
  if(c) return "Uložení se nepovedlo ("+c+").";
  if(c==="revoked") return "Přístup k aplikaci byl odebrán.";
  return "Uložení se nepovedlo, zkuste to znovu.";
}

/* ---------- derived data ---------- */
const veh = id => S.vehicles.find(v=>v.id===id);
function curKm(v){
  // ruční přepis v „Upravit vůz“ má přednost; počítají se jen novější hlášení
  const since = v.kmSetAt || "";
  let k = v.km||0;
  const r=S.readings[v.id]; if(r&&r.km>k&&(!since||(r.at||"")>since)) k=r.km;
  for(const d of S.defects) if(d.vehicleId===v.id && d.km>k && (!since||(d.createdAt||"")>since)) k=d.km;
  if(!since){ if(v.oilKm>k) k=v.oilKm; if(v.svcKm>k) k=v.svcKm; }
  return k||null;
}
function mkDue(v,label,date,kmAt,km){
  const days = date!=null ? daysUntil(date) : null;
  const left = (kmAt!=null && km!=null) ? kmAt-km : null;
  let level="ok";
  if((days!=null&&days<0)||(left!=null&&left<0)) level="late";
  else if((days!=null&&days<=30)||(left!=null&&left<=(isMach(v)?50:3000))) level="soon";
  const score = Math.min(days??1e9, left!=null? left/(isMach(v)?8:400) : 1e9);
  const parts=[];
  if(days!=null) parts.push(days<0? `prošlo před ${-days} ${plural(-days,"dnem","dny","dny")}` : days===0? "dnes" : `za ${days} ${plural(days,"den","dny","dní")}`);
  if(left!=null) parts.push(left<0? `přejeto o ${fKmV(-left,v)}` : `za ${fKmV(left,v)}`);
  const sub=[]; if(date) sub.push(fD(date)); if(kmAt!=null) sub.push("při "+fKmV(kmAt,v));
  return {v,label,level,score,when:parts.join(" / "),sub:sub.join(", ")};
}
function deadlines(v){
  const km=curKm(v), out=[];
  if(v.stkDate) out.push(mkDue(v,"STK",v.stkDate,null,km));
  if(v.oilDate||v.oilKm!=null){
    const d = v.oilDate&&v.oilEveryMonths ? addMonths(v.oilDate,v.oilEveryMonths) : null;
    const k = v.oilKm!=null&&v.oilEveryKm ? v.oilKm+v.oilEveryKm : null;
    if(d||k!=null) out.push(mkDue(v,"Výměna oleje",d,k,km));
  }
  if(v.svcDate||v.svcKm!=null){
    const d = v.svcDate&&v.svcEveryMonths ? addMonths(v.svcDate,v.svcEveryMonths) : null;
    const k = v.svcKm!=null&&v.svcEveryKm ? v.svcKm+v.svcEveryKm : null;
    if(d||k!=null) out.push(mkDue(v,"Pravidelný servis",d,k,km));
  }
  for(const c of (v.custom||[])) if(c.name&&c.date) out.push(mkDue(v,c.name,c.date,null,km));
  return out.sort((a,b)=>a.score-b.score);
}
const openDefects = vid => S.defects.filter(d=>d.vehicleId===vid && (d.status==="nova"||d.status==="resi"));
const worst = list => list.some(x=>x.level==="late")?"late":list.some(x=>x.level==="soon")?"soon":"ok";

const plateHTML = (spz,big) => `<span class="plate${big?" big":""}" aria-label="SPZ ${esc(spz)}"><span class="eu">CZ</span><span class="no">${esc(spz||"—")}</span></span>`;
const truckSVG = `<svg width="96" height="56" viewBox="0 0 96 56" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" style="color:var(--muted)"><rect x="4" y="8" width="56" height="32" rx="2"/><path d="M60 18h16l12 12v10H60z"/><circle cx="22" cy="44" r="6" fill="var(--surface2)"/><circle cx="74" cy="44" r="6" fill="var(--surface2)"/></svg>`;

    $("#bk").onclick=()=>go("home");

function loadImg(file){
  return new Promise((res,rej)=>{ const u=URL.createObjectURL(file), im=new Image();
    im.onload=()=>res({src:im,w:im.naturalWidth,h:im.naturalHeight,done:()=>URL.revokeObjectURL(u)});
    im.onerror=()=>{URL.revokeObjectURL(u); rej(new Error("decode"));}; im.src=u; });
}
async function decode(file){
  try{ const b=await createImageBitmap(file); return {src:b,w:b.width,h:b.height,done:()=>b.close&&b.close()}; }
  catch(e){ return await loadImg(file); }
}
async function uploadPhoto(file){
  if(!file||!file.size) return null;
  let b=null;
  try{
    const im=await decode(file), max=1280, sc=Math.min(1,max/Math.max(im.w,im.h));
    const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(im.w*sc)); c.height=Math.max(1,Math.round(im.h*sc));
    c.getContext("2d").drawImage(im.src,0,0,c.width,c.height); im.done();
    for(const q of [0.78,0.6,0.45]){ b=await new Promise(r=>c.toBlob(r,"image/jpeg",q)); if(b&&b.size<650000) break; }
  }catch(e){}
  if(!b){
    const ok=["image/jpeg","image/png","image/webp","image/gif"];
    if(!ok.includes(file.type)) throw {code:"decode"};
    b=file;
  }
  const res=await assets.upload(b,{type:b.type||"image/jpeg"});
  return res.id;
}

  catch(e){ console.error(e); photoError(e,step,f); }
}
function photoError(e,step,f){

}

const orderTasks = o => [...TASKS, ...(o.extra||[])].filter(t=>!(o.removed||[]).includes(t));
let ckEdit=false;
async function startOrder(v){
  try{ await db.doc("orders/"+v.id).set({vehicleId:v.id, date:iso(), km:curKm(v), checked:[], extra:[], by:myId}); window.scrollTo(0,0); }
  catch(e){ toast(errMsg(e)); }
}
let oBusy=false, oPending=null;
async function writeOrder(vid,patch){
  oPending={vid,patch:{...(oPending&&oPending.vid===vid?oPending.patch:{}),...patch}};
  if(oBusy) return; oBusy=true;
  try{ while(oPending){ const {vid:id,patch:p}=oPending; oPending=null; await db.doc("orders/"+id).update(p); } }
  catch(e){ toast(errMsg(e)); } finally{ oBusy=false; }
}
function bindOrder(v,o){
  $$("#ck input").forEach(i=>i.onchange=()=>{ const checked=$$("#ck input").filter(x=>x.checked).map(x=>x.value); S.orders[v.id]={...o,checked}; writeOrder(v.id,{checked}); render(); });
  const add=()=>{ const t=$("#newT").value.trim(); if(!t) return; if(orderTasks(o).includes(t)){toast("Tento úkon už v seznamu je.");return;}
    if((o.removed||[]).includes(t)){ const removed=o.removed.filter(x=>x!==t); S.orders[v.id]={...o,removed}; writeOrder(v.id,{removed}); render(); return; } const extra=[...(o.extra||[]),t]; S.orders[v.id]={...o,extra}; writeOrder(v.id,{extra}); render(); };
  $("#ckEd").onclick=()=>{ ckEdit=!ckEdit; render(); };
  if($("#ckRe")) $("#ckRe").onclick=()=>{ S.orders[v.id]={...o,removed:[]}; writeOrder(v.id,{removed:[]}); render(); };
  $$("[data-rm]").forEach(b=>b.onclick=()=>{ const t=b.dataset.rm;
    const checked=(o.checked||[]).filter(x=>x!==t);
    if((o.extra||[]).includes(t)){ const extra=o.extra.filter(x=>x!==t); S.orders[v.id]={...o,extra,checked}; writeOrder(v.id,{extra,checked}); }
    else { const removed=[...(o.removed||[]),t]; S.orders[v.id]={...o,removed,checked}; writeOrder(v.id,{removed,checked}); }
    render(); });
  $("#addT").onclick=add; $("#newT").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); add(); } };
  $("#finO").onclick=()=>{ const cur=S.orders[v.id]||o; logForm(v,null,{date:iso(), km:curKm(v)||cur.km||"", tasks:cur.checked||[], types:[], parts:[], fromOrder:true}); };
  $("#canO").onclick=async()=>{ if(!await askConfirm("Zrušit rozpracovaný servis? Odškrtané úkony se nezapíšou.","Zrušit servis")) return; try{ await db.doc("orders/"+v.id).delete(); toast("Servis zrušen."); }catch(e){toast(errMsg(e));} };
}

      const fd=new FormData(f), g=k=>String(fd.get(k)||"").trim();

        by:x.by||myId, createdAt:x.createdAt||new Date().toISOString() };

  $("#addP",f).onclick=()=>{ $("#parts",f).insertAdjacentHTML("beforeend",partRow()); bindRm(); };
  bindRm();
  if($("#delL",f)) $("#delL",f).onclick=async()=>{ if(!await askConfirm(isRep?"Smazat tuto opravu?":"Smazat tento servisní záznam?")) return; try{ await db.doc("log/"+l.id).delete(); dlg.close(); toast("Smazáno."); }catch(e){toast(errMsg(e));} };
}

async function deleteVehicle(v){
  if(!await askConfirm(`Smazat vůz ${v.spz} včetně jeho závad a servisní knihy? Tohle nejde vrátit.`)) return;
  try{
    for(const d of S.defects.filter(d=>d.vehicleId===v.id)) await db.doc("defects/"+d.id).delete();
    for(const l of S.logs) await db.doc("log/"+l.id).delete();
    for(const x of S.parts.filter(x=>x.vehicleId===v.id)) await db.doc("parts/"+x.id).delete();
    await db.doc("readings/"+v.id).delete();
    await db.doc("orders/"+v.id).delete();
    await db.doc("vehicles/"+v.id).delete();
    if(v.photo&&assets) assets.delete(v.photo).catch(()=>{});
    go("home"); toast("Vůz smazán.");
  }catch(e){ toast(errMsg(e)); }
}

/* ---------- Firebase ---------- */
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
try { fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch (e) { fs = initializeFirestore(fbApp, {}); }

const wrapSnap = snap => ({ docs: snap.docs.map(d => ({ id: d.id, data: () => d.data() })) });
function docRef(path, collName){
  const r = path ? doc(fs, path) : doc(collection(fs, collName));
  return { id: r.id, set: d => setDoc(r, d), update: d => updateDoc(r, d), delete: () => deleteDoc(r) };
}
function coll(name, cons = []){
  return {
    where: (f, op, v) => coll(name, [...cons, where(f, op, v)]),
    orderBy: (f, dir) => coll(name, [...cons, orderBy(f, dir)]),
    limit: n => coll(name, [...cons, limit(n)]),
    onSnapshot: (cb, err) => { const u = onSnapshot(query(collection(fs, name), ...cons), s => cb(wrapSnap(s)), err); unsubs.push(u); return u; },
    add: data => addDoc(collection(fs, name), data),
    doc: id => docRef(id ? name + "/" + id : null, name)
  };
}
db = { collection: n => coll(n), doc: p => docRef(p) };

const blobToDataURL = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
assets = {
  upload: async b => {
    const data = await blobToDataURL(b);
    if (data.length > 950000) throw { code: "too_large" };
    const r = await addDoc(collection(fs, "photos"), { data, createdAt: new Date().toISOString(), by: myId });
    photoCache[r.id] = data;
    return { id: r.id };
  },
  delete: id => deleteDoc(doc(fs, "photos/" + id))
};

const profileCache = {};
user = {
  id: async () => myId,
  canEdit: async () => isService,
  profiles: async ids => {
    const out = {};
    await Promise.all(ids.map(async id => {
      if (!(id in profileCache)) {
        try { const s = await getDoc(doc(fs, "users/" + id)); profileCache[id] = s.exists() ? s.data().name : null; }
        catch (e) { profileCache[id] = null; }
      }
      out[id] = { name: profileCache[id], isMe: id === myId };
    }));
    return out;
  }
};

let unsubs = [], access = null, myEmail = "", started = false;
function stopAll(){ if (accessUnsub) { try { accessUnsub(); } catch (e) {} accessUnsub = null; } unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; if (unsubLog) { unsubLog(); unsubLog = null; } started = false; }

function hdrBtns(){
  return `${isService ? `<button class="hbtn" id="usersB">Uživatelé</button>` : `<span class="role">Řidič</span>`}<button class="hbtn" id="outB" aria-label="Odhlásit">Odhlásit</button>`;
}
function bindHdr(){
  if ($("#usersB")) $("#usersB").onclick = usersForm;
  if ($("#outB")) $("#outB").onclick = async () => { if (await askConfirm("Odhlásit se?","Odhlásit")) signOut(auth); };
}

/* ---------- přihlášení ---------- */
const AUTH_ERR = {
  "auth/invalid-credential": "Špatný e-mail nebo heslo.",
  "auth/wrong-password": "Špatné heslo.",
  "auth/user-not-found": "Účet s tímto e-mailem neexistuje – zaregistrujte se.",
  "auth/email-already-in-use": "Tento e-mail už má účet – přihlaste se.",
  "auth/weak-password": "Heslo musí mít aspoň 6 znaků.",
  "auth/invalid-email": "Neplatný e-mail.",
  "auth/too-many-requests": "Moc pokusů – zkuste to za chvíli.",
  "auth/network-request-failed": "Není připojení k internetu."
};
function showLogin(mode = "login"){
  $("#hdr").innerHTML = `<h1>Servis vozového parku</h1>`;
  if (fabEl) { fabEl.remove(); fabEl = null; }
  const reg = mode === "register";
  $("#app").innerHTML = `<form class="auth" id="authF">
    <h2>${reg ? "Registrace" : "Přihlášení"}</h2>
    ${reg ? `<label class="f">Jméno a příjmení<input name="name" required autocomplete="name"></label>` : ""}
    <label class="f">E-mail<input name="email" type="email" required autocomplete="email"></label>
    <label class="f">Heslo<input name="pass" type="password" required minlength="6" autocomplete="${reg ? "new-password" : "current-password"}"></label>
    <p class="err" id="aErr" hidden></p>
    <button class="btn primary" type="submit">${reg ? "Vytvořit účet" : "Přihlásit se"}</button>
    ${reg ? `<button type="button" class="linkbtn" id="swB">Už mám účet – přihlásit se</button>`
          : `<button type="button" class="linkbtn" id="swB">Nemám účet – registrovat</button><button type="button" class="linkbtn" id="rsB">Zapomenuté heslo</button>`}
    <p class="small muted" style="margin:0">Registrujte se e-mailem, který jste nahlásili servisu. Bez něj se do aplikace nedostanete.</p>
  </form>`;
  const f = $("#authF"), err = $("#aErr");
  const fail = e => { err.hidden = false; err.textContent = AUTH_ERR[e.code] || ("Chyba: " + (e.code || e.message)); };
  f.onsubmit = async ev => {
    ev.preventDefault(); err.hidden = true;
    const fd = new FormData(f), em = String(fd.get("email")).trim(), pw = String(fd.get("pass"));
    try {
      if (reg) { const c = await createUserWithEmailAndPassword(auth, em, pw); await updateProfile(c.user, { displayName: String(fd.get("name")).trim() }); await saveMe(c.user); }
      else await signInWithEmailAndPassword(auth, em, pw);
    } catch (e) { fail(e); }
  };
  $("#swB").onclick = () => showLogin(reg ? "login" : "register");
  if ($("#rsB")) $("#rsB").onclick = async () => {
    const em = String(new FormData(f).get("email")).trim();
    if (!em) { err.hidden = false; err.textContent = "Nejdřív vyplňte e-mail."; return; }
    try { await sendPasswordResetEmail(auth, em); err.hidden = false; err.style.color = "var(--green)"; err.textContent = "Odkaz na nové heslo jsme poslali na " + em + "."; }
    catch (e) { fail(e); }
  };
}
async function saveMe(u){
  try { await setDoc(doc(fs, "users/" + u.uid), { name: u.displayName || (u.email || "").split("@")[0], email: (u.email || "").toLowerCase() }, { merge: true }); } catch (e) {}
}
function showMsg(html){
  $("#hdr").innerHTML = `<h1>Servis vozového parku</h1><button class="hbtn" id="outB">Odhlásit</button>`; bindHdr();
  if (fabEl) { fabEl.remove(); fabEl = null; }
  $("#app").innerHTML = `<div class="auth">${html}</div>`;
}
function showSetup(){
  showMsg(`<h2>První spuštění</h2><p style="margin:0">Aplikace ještě nemá správce. Jste vedoucí servisu? Stanete se prvním správcem a pak přidáte ostatní.</p>
    <button class="btn primary" id="setupB">Stát se správcem (${esc(myEmail)})</button>`);
  $("#setupB").onclick = async () => {
    try { await setDoc(doc(fs, "settings/access"), { service: [myEmail], drivers: [] }); }
    catch (e) { toast(errMsg(e)); }
  };
}
function showNoAccess(){
  showMsg(`<h2>Zatím nemáte přístup</h2><p style="margin:0">Požádejte servis, ať do aplikace přidá váš e-mail:</p><p style="margin:0;font-weight:700">${esc(myEmail)}</p><p class="small muted" style="margin:0">Jakmile vás přidají, aplikace se sama otevře.</p>`);
}

function usersForm(){
  const a = access || { service: [], drivers: [] };
  sheet("Uživatelé", `
    <p class="small muted" style="margin:0">Jeden e-mail na řádek. Lidé se pak zaregistrují v aplikaci právě tímto e-mailem.</p>
    <label class="f">Servis – vidí a upravují vše<textarea name="service" rows="4">${esc((a.service || []).join("\n"))}</textarea></label>
    <label class="f">Řidiči – hlásí závady a km<textarea name="drivers" rows="8">${esc((a.drivers || []).join("\n"))}</textarea></label>`,
  { onSubmit: async f => {
      const fd = new FormData(f);
      const list = k => [...new Set(String(fd.get(k) || "").split(/[\s,;]+/).map(x => x.trim().toLowerCase()).filter(x => x.includes("@")))];
      const service = list("service"); if (!service.includes(myEmail)) service.unshift(myEmail);
      await updateDoc(doc(fs, "settings/access"), { service, drivers: list("drivers").filter(x => !service.includes(x)) });
      toast("Uživatelé uloženi.");
  }});
}

function startApp(){
  started = true;
  S.ready = { v: false, d: false };
  db.collection("vehicles").onSnapshot(s => { S.vehicles = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.v = true; render(); }, e => toast(errMsg(e)));
  db.collection("defects").orderBy("createdAt", "desc").limit(1000).onSnapshot(s => { S.defects = s.docs.map(d => ({ id: d.id, ...d.data() })); S.ready.d = true; if (!dlg.open) render(); }, e => toast(errMsg(e)));
  db.collection("orders").onSnapshot(s => { const r = {}; s.docs.forEach(d => r[d.id] = { id: d.id, ...d.data() }); S.orders = r; if (!dlg.open && !oBusy) render(); }, () => {});
  db.collection("readings").onSnapshot(s => { const r = {}; s.docs.forEach(d => r[d.id] = d.data()); S.readings = r; if (!dlg.open) render(); }, e => toast(errMsg(e)));
  db.collection("parts").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>{ S.parts=s.docs.map(d=>({id:d.id,...d.data()})); if(!dlg.open) render(); }, e=>toast(errMsg(e)));
  db.collection("log").orderBy("createdAt","desc").limit(1000).onSnapshot(s=>{ S.allLogs=s.docs.map(d=>({id:d.id,...d.data()})); if(!dlg.open&&(S.view==="done"||S.view==="home")) render(); }, e=>toast(errMsg(e)));
  render();
}

function boot(){
  if (!firebaseConfig || !firebaseConfig.apiKey || String(firebaseConfig.apiKey).includes("VLOZTE")) {
    $("#app").innerHTML = `<div class="auth"><h2>Chybí nastavení</h2><p style="margin:0">Vyplňte údaje z Firebase do souboru <strong>config.js</strong> (viz NÁVOD).</p></div>`; return;
  }
  dlg.addEventListener("close", () => { if (started) render(); });
  onAuthStateChanged(auth, async u => {
    stopAll(); access = null;
    if (dlg.open) dlg.close();
    if (!u) { showLogin(); return; }
    myId = u.uid; myEmail = (u.email || "").toLowerCase();
    $("#app").innerHTML = `<p class="muted">Načítám…</p>`;
    saveMe(u);
    const ua = onSnapshot(doc(fs, "settings/access"), s => {
      if (!s.exists()) { stopData(); showSetup(); return; }
      access = s.data();
      const svc = (access.service || []).includes(myEmail), drv = (access.drivers || []).includes(myEmail);
      if (!svc && !drv) { stopData(); showNoAccess(); return; }
      isService = svc;
      if (!started) startApp(); else render();
    }, e => { $("#app").innerHTML = `<div class="auth"><p class="err">${esc(errMsg(e))}</p></div>`; });
    // access listener must survive stopData()
    accessUnsub = ua;
  });
}
let accessUnsub = null;
function stopData(){
  const keep = accessUnsub;
  unsubs.forEach(u => { if (u !== keep) try { u(); } catch (e) {} });
  unsubs = []; if (unsubLog) { unsubLog(); unsubLog = null; } started = false;
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
boot();
</script>
